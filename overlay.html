<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Vio Studio · OBS Overlay</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important}
    body{display:grid;place-items:center}
    canvas{display:block;width:100%;height:auto!important;max-height:100vh;aspect-ratio:auto;object-fit:contain;background:transparent}
    .overlay-controls{display:none;position:fixed;left:12px;right:12px;bottom:12px;z-index:20;gap:8px;align-items:center;flex-wrap:wrap;padding:10px;border:1px solid #9ce0c977;border-radius:14px;background:rgba(12,20,27,.94);backdrop-filter:blur(14px);font:12px system-ui;color:#e9fff5}
    .overlay-controls.is-visible{display:flex}
    .overlay-controls button,.overlay-controls select,.overlay-controls-show{min-height:38px;padding:8px 12px;border:1px solid #9ce0c977;border-radius:10px;background:#23343b;color:#e9fff5;font:700 12px system-ui}
    .overlay-controls button[aria-pressed=true]{background:#9ce0c9;color:#10231e}
    .overlay-controls select{max-width:180px}
    .overlay-controls-show{display:none;position:fixed;right:12px;bottom:12px;z-index:21}
    .overlay-controls-show.is-visible{display:block}
    .status{display:none;position:fixed;left:12px;right:12px;top:12px;max-width:560px;padding:12px 14px;border:1px solid #9ce0c955;border-radius:12px;background:rgba(16,24,31,.92);backdrop-filter:blur(12px);color:#d9f8ec;font:12px/1.5 system-ui;pointer-events:none;box-shadow:0 8px 30px #0007;z-index:10}
    .status.is-visible,.debug .status{display:block}
    .status.is-error{border-color:#ff8f9c99;background:rgba(44,20,27,.94);color:#ffd0d6}
  </style>
  <script>
    if(new URLSearchParams(location.search).get("debug")==="1")document.documentElement.classList.add("debug");
  </script>
</head>
<body>
  <canvas id="stage" width="1080" height="1920"></canvas>
  <div id="status" class="status" role="status" aria-live="polite">Connecting to Vio Studio…</div>
  <div id="overlayControls" class="overlay-controls" aria-label="OBS overlay controls">
    <button id="overlayMicToggle" type="button" aria-pressed="false">Aktifkan Mic</button>
    <select id="overlayMicDevice" aria-label="Microphone input"><option value="">System default mic</option></select>
    <button id="overlayGridToggle" type="button" aria-pressed="false">Grid ON/OFF</button>
    <button id="overlayCenterToggle" type="button" aria-pressed="false">Center guide ON/OFF</button>
    <button id="overlayControlsHide" type="button">Sembunyikan kontrol</button>
  </div>
  <button id="overlayControlsShow" class="overlay-controls-show" type="button">Overlay controls</button>
  <script type="module" src="./src/overlay.js"></script>
</body>
</html>
