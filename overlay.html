<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Vio Studio · OBS Overlay</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important}
    canvas{display:block;width:100%;height:100%;object-fit:contain;background:transparent}
    .status{display:none;position:fixed;left:10px;bottom:8px;color:#ffffff75;font:10px system-ui;pointer-events:none}
    .debug .status{display:block}
  </style>
  <script>
    if(new URLSearchParams(location.search).get("debug")==="1")document.documentElement.classList.add("debug");
  </script>
</head>
<body>
  <canvas id="stage" width="1080" height="1920"></canvas>
  <div id="status" class="status">Connecting…</div>
  <script type="module" src="./src/overlay.js"></script>
</body>
</html>
