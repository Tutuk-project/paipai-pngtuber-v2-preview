name: Preview validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check browser JavaScript syntax
        run: |
          node --check src/app.js
          node --check src/avatar-renderer.js
          node --check src/overlay.js
      - name: Check required preview files
        run: |
          test -s index.html
          test -s overlay.html
          test -s src/config.js
          test -s supabase/functions/vio-api/index.ts
          grep -q 'avatarScaleDecrease' index.html
          grep -q 'accessoryScaleControls' index.html
          ! grep -q 'id="obs"' src/app.js
