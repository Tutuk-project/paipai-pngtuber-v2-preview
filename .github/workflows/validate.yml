name: Validate Vio Studio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SQL validation dependency
        run: python -m pip install pglast
      - name: Run regression tests
        run: npm test
      - name: Check JavaScript syntax and migrations
        run: npm run check
      - name: Run preview validation gate checks
        run: |
          node --check src/app.js
          node --check src/avatar-renderer.js
          node --check src/overlay.js
          node --test tests/security-hardening.test.mjs
          test -s index.html
          test -s overlay.html
          test -s src/config.js
          test -s supabase/functions/vio-api/index.ts
          grep -q 'avatarScaleDecrease' index.html
          grep -q 'accessoryScaleControls' index.html
          grep -q 'id="overlayLinkDialog"' index.html
          grep -q 'id="roomStageNotice"' index.html
          grep -q 'new URL("overlay.html", document.baseURI)' src/app.js
          grep -q 'room-controls-layout' src/app.js
          grep -q 'Room data unavailable' src/app.js
          grep -q 'setStatus' src/overlay.js
          grep -Fq '.debug .status,.status.is-visible{display:block}' overlay.html
          grep -q '.app-shell.in-room .room-actions' assets/app.css
          grep -q '.room-controls-layout' assets/app.css
          ! grep -q 'id="obs"' src/app.js
