name: Deploy Vio Studio v2 Preview

on:
  workflow_run:
    workflows: ["Preview validation"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the exact validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          test -f index.html
          test -f assets/app.css
          test -f src/config.js
          touch .nojekyll
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.event.workflow_run.head_sha }}-${{ github.run_attempt }}
          path: .
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.event.workflow_run.head_sha }}-${{ github.run_attempt }}
